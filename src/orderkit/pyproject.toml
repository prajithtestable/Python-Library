# Distribution manifest -- the CSharpWebApi.csproj analogue.
#
# This project type IS the packaging metadata, so this file carries far more
# weight here than in the sibling repositories: classifiers, URLs, extras and
# the py.typed marker are the deliverable, not incidental configuration.

[build-system]
# hatchling 1.32.0 is the newest release installable on Python 3.13.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "orderkit"
version = "1.0.0"
description = "Order pricing primitives for retail and wholesale channels"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
keywords = ["orders", "pricing", "retail", "wholesale"]
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]
dependencies = [
  # -------------------------------------------------------------------
  # DELIBERATELY VULNERABLE PINS -- Trivy detection fixture.
  # Every advisory ID below was confirmed against the live PyPI Advisory
  # Database. See tools/Trivy/PLANTED-CVES.md before "fixing" any of these.
  # -------------------------------------------------------------------
  "requests==2.31.0",              # planted: PYSEC-2026-1873, PYSEC-2026-1872, PYSEC-2026-2275
  "Jinja2==3.1.3",                 # planted: PYSEC-2026-1471, PYSEC-2026-1472, PYSEC-2026-1474, PYSEC-2026-1475
  "urllib3==2.0.6",                # planted: PYSEC-2023-212, PYSEC-2026-141, PYSEC-2026-1995
  "cryptography==42.0.0",          # planted: PYSEC-2024-225, PYSEC-2026-1284, PYSEC-2026-1285
  "paramiko==2.4.1",               # planted: CVE-2018-1000805, PYSEC-2022-166
]

[project.optional-dependencies]
docs = ["packaging==26.3"]

[project.urls]
Homepage = "https://example.invalid/orderkit"
Documentation = "https://example.invalid/orderkit/docs"
Changelog = "https://example.invalid/orderkit/changelog"

[tool.hatch.build.targets.wheel]
packages = ["orderkit"]
# PEP 561: the marker must ship inside the wheel or type checkers ignore the
# inline annotations entirely. Omitting this is a classic packaging defect.
[tool.hatch.build.targets.wheel.force-include]
"orderkit/py.typed" = "orderkit/py.typed"

[tool.hatch.build.targets.sdist]
include = ["orderkit", "README.md"]
