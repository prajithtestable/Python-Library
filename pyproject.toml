# Workspace root for the Python-DataPipeline test repository.
#
# This file is the analogue of Directory.Build.props + the .sln in the C#
# reference repository: it declares the three member projects and holds the
# shared tool configuration they all inherit.

[project]
name = "python-clitool"
version = "1.0.0"
description = "Typer/Click developer CLI test repository -- Python 3.10 branch"
requires-python = ">=3.10,<3.11"

[tool.uv.workspace]
members = [
  "src/orderkit",
  "tests/orderkit_tests",
  "tools/orderkit_tools",
]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src/orderkit", "tests/orderkit_tests"]
extend-exclude = ["src/orderkit/orderkit/analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests/orderkit_tests"]
pythonpath = ["src/orderkit"]
addopts = "-q"

# ---------------------------------------------------------------- pylint
[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["^src/orderkit/orderkit/analysis/.*$"]

[tool.pylint."messages control"]
disable = ["missing-module-docstring"]

# ---------------------------------------------------------------- vulture
[tool.vulture]
min_confidence = 60
paths = ["src/orderkit/orderkit"]
sort_by_size = true
