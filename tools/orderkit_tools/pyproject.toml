# Tool-integration project -- the CSharpWebApi.Tools.csproj analogue.
#
# Depends on BOTH the application and the test project so that it always
# resolves last, exactly as CSharpWebApi.Tools references CSharpWebApi and
# CSharpWebApi.Tests.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderkit-tools"
version = "1.0.0"
description = "Static analysis and quality tool integration for the orderctl CLI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "orderkit",
  "orderkit-tests",
  "build==1.5.0",
  "twine==7.0.0",
  "setuptools==84.0.0",
  "ruff==0.16.2",
  "complexipy==7.0.1",
  "pylint==4.0.7",
  "astroid==4.3.0",
  "vulture==2.16",
  "pyan3==2.6.2",
  "dulwich==1.2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["orderkit_tools"]
