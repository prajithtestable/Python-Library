# Test project -- the CSharpWebApi.Tests.csproj analogue.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderkit-tests"
version = "1.0.0"
description = "Unit tests for the orderctl developer CLI"
requires-python = ">=3.9,<3.10"
dependencies = [
  "orderkit",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "slipcover==1.0.18",
  "mutmut==3.3.1",
  "diff-cover==10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["orderkit_tests"]
